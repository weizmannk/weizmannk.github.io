open_source:
  - name: NMMA-Astro-COLIBRI
    description: >-
      Reproducibility package for an automated supernova light-curve
      classification service, built on the NMMA nested-sampling
      framework; includes the fits and analysis scripts behind the
      SN 2021ugl case study.
    links:
      - https://nmma.live/
      - https://github.com/astro-transients/nmma-astrocolibri-sn2021ugl
  - name: Astro-COLIBRI
    description: >-
      Real-time multi-messenger astrophysics platform: a public API,
      cloud alert system, and website/mobile apps that filter and
      contextualize incoming alerts (GRBs, FRBs, supernovae,
      gravitational waves) so astronomers can react quickly to
      transient events.
    links:
      - https://astro-colibri.com
  - name: SkyPortal
    description: >-
      Collaborative astronomical data platform for time-domain
      astronomy, providing the infrastructure to manage, visualize, and
      analyze transient discoveries across a research team.
    links:
      - https://github.com/skyportal/skyportal
  - name: NMMA
    description: >-
      Python library for nuclear physics and multi-messenger inference,
      combining gravitational-wave, electromagnetic, and other data to
      constrain the physics of binary neutron star mergers.
    links:
      - https://github.com/nuclear-multimessenger-astronomy/nmma
  - name: M4OPT
    description: >-
      Open-source toolkit that jointly solves telescope tiling and
      scheduling via mixed-integer programming, coordinating space- and
      ground-based observatories for rapid follow-up of
      gravitational-wave and neutrino events.
    links:
      - https://github.com/m4opt/m4opt
  - name: tilepy
    description: >-
      Python package for gravitational-wave follow-up scheduling with
      Imaging Atmospheric Cherenkov Telescopes (IACTs), tiling the
      sky-localization region to optimize observation strategy when GW
      events are poorly localized.
    links:
      - https://github.com/astro-transients/tilepy
  - name: GWEMOPT
    description: >-
      Tool for optimizing electromagnetic follow-up of gravitational-
      wave events, coordinating multi-telescope tiling searches to
      efficiently locate optical/IR counterparts.
    links:
      - https://github.com/skyportal/gwemopt
  - name: ligo.skymap
    description: >-
      Toolkit for reading, writing, generating, and visualizing
      gravitational-wave probability sky maps, including the BAYESTAR
      rapid-localization algorithm and 3D sky map analysis.
    links:
      - https://lscsoft.docs.ligo.org/ligo.skymap/
  - name: observing-scenarios-simulations
    description: >-
      Scripts and data generating LIGO/Virgo/KAGRA compact-binary-
      coalescence observing-scenario predictions, simulating source
      populations and sky localization with BAYESTAR.
    links:
      - https://github.com/lpsinger/observing-scenarios-simulations
  - name: DeepClean / Virgo-DeepClean
    description: >-
      1D convolutional neural network for non-linear, non-stationary
      noise subtraction in GW data.
    links:
      - https://github.com/weizmannk/Virgo-DeepClean
  - name: cbc-population-distributions
    description: >-
      Tools to draw compact-binary-coalescence populations from the
      GWTC-4.0 model (FullPop-4.0 component-mass distribution,
      power-law redshift distribution) for large-scale population
      sampling and visualization.
    links:
      - https://cbc-population-distributions.readthedocs.io/en/latest/
  - name: EarthOrbitPlan
    description: >-
      Educational framework walking students and researchers through an
      end-to-end compact-binary-coalescence workflow, from
      gravitational-wave detection to planning electromagnetic
      follow-up campaigns across multiple telescopes.
    links:
      - https://earthorbitplan.readthedocs.io/en/latest/

