bio: |
  Weizmann Kiendrebeogo is a postdoctoral researcher at IRFU / CEA Paris-Saclay,
  working on multi-messenger astronomy and gravitational waves. He develops and
  maintains Astro-COLIBRI, a real-time platform for multi-wavelength and
  multi-messenger transient analysis, and works on low-latency inference for
  gravitational-wave counterparts.

  He is a member of the LIGO-Virgo-KAGRA and GRANDMA collaborations. His path
  into gravitational-wave science began by modeling the black-hole-vs-wormhole
  imaging of M87* with Event Horizon Telescope data. Since then his work has
  spanned compact binary coalescences, observation planning, and Bayesian
  inference for multi-messenger follow-up. He completed his PhD in Planetary
  and Universe Sciences at Université Côte d'Azur in 2024.
